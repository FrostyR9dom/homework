<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея | СвояТропа</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/gallery.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <i class="fas fa-mountain"></i>
                <span>СвояТропа</span>
            </a>
            <button class="mobile-menu-toggle" aria-label="Меню"><i class="fas fa-bars"></i></button>
            <nav class="nav">
                <a href="index.html" class="nav-link">Маршруты</a>
                <a href="gallery.html" class="nav-link active">Галерея</a>
                <a href="forum.html" class="nav-link">Форум</a>
                <a href="create-route.html" class="nav-link">Создать маршрут</a>
                <div class="guest-only">
                    <a href="register.html" class="btn btn-outline">Войти</a>
                </div>
                <div class="auth-only" style="display: none;">
                    <div class="user-menu">
                        <a href="profile.html" class="user-profile-link">
                            <img src="img/avatars/default-avatar.png" class="user-avatar-display" alt="Аватар">
                            <span class="user-name-display"></span>
                        </a>
                        <button class="btn btn-outline btn-small logout-btn">Выйти</button>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="gallery-page">
        <div class="container">
            <div class="gallery-page-header">
                <h1><i class="fas fa-images"></i> Галерея путешествий</h1>
                <p>Фотографии от туристов со всего мира</p>

                <div class="gallery-controls">
                    <button class="btn btn-primary" id="uploadPhotoBtn">
                        <i class="fas fa-cloud-upload-alt"></i> Загрузить фото
                    </button>
                    <div class="gallery-filters">
                        <select id="gallerySort">
                            <option value="rating">По рейтингу</option>
                            <option value="newest">Сначала новые</option>
                            <option value="oldest">Сначала старые</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="gallery-grid" id="fullGalleryGrid">
                <!-- Фотографии загружаются через JS -->
            </div>

            <div class="load-more-wrapper">
                <button class="btn btn-outline btn-large" id="loadMorePhotos">
                    <i class="fas fa-plus"></i> Загрузить ещё
                </button>
            </div>
        </div>

        <!-- Модальное окно просмотра фото -->
        <div class="modal" id="photoModal">
            <div class="modal-content photo-modal-content">
                <button class="modal-close">&times;</button>
                <img id="modalPhoto" src="" alt="">
                <div class="photo-info">
                    <div class="photo-author">
                        <span id="modalAuthor"></span>
                    </div>
                    <div class="photo-rating">
                        <span id="modalRating"></span>
                        <div class="rating-controls">
                            <input type="range" id="ratingSlider" min="1" max="100" value="50">
                            <button class="btn btn-primary btn-small" id="submitRating">Оценить</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Скрытый input для загрузки файла -->
        <input type="file" id="photoFileInput" accept="image/*" style="display: none;">
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© 2026 СвояТропа.</p>
            </div>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/gallery.js"></script>
</body>

</html>
